name: Build iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build ipa
        run: |
          xcodebuild -project MyApp.xcodeproj -scheme MyApp -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            exit $code
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/MyApp.app Payload/
          zip -qr MyApp.ipa Payload
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-ipa
          path: MyApp.ipa
      - name: Upload to temp host
        if: success()
        run: |
          url1=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@MyApp.ipa" https://catbox.moe/user/api.php)
          echo "::notice title=IPA_CATBOX::$url1"
          url2=$(curl -s --upload-file MyApp.ipa https://transfer.sh/MyApp.ipa)
          echo "::notice title=IPA_TRANSFER::$url2"
