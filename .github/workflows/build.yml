name: Build iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build ipa
        run: |
          xcodebuild -project MyApp.xcodeproj -scheme MyApp -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            exit $code
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/MyApp.app Payload/
          zip -qr MyApp.ipa Payload
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-ipa
          path: MyApp.ipa
      - name: Upload to temp host
        if: success()
        run: |
          l1=$(curl -s -A "Mozilla/5.0 (Macintosh)" -F "reqtype=fileupload" -F "fileToUpload=@MyApp.ipa" https://litterbox.catbox.moe/resources/internals/api.php)
          echo "::notice title=IPA_LITTERBOX::$l1"
          f1=$(curl -s -A "curl" -F "file=@MyApp.ipa" https://file.io)
          u=$(echo "$f1" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('link','FAIL'))")
          echo "::notice title=IPA_FILEIO::$u"
          t1=$(curl -s -A "curl" -F "file=@MyApp.ipa" https://tmpfiles.org/api/v1/upload)
          u2=$(echo "$t1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('data',{}).get('url','FAIL'))")
          echo "::notice title=IPA_TMPFILES::$u2"
