name: Build iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: |
          xcodebuild -project MyApp.xcodeproj -scheme MyApp -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "## Build failed log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            msg=$(python3 -c "import sys; s=open('build.log').read()[:1800]; print(s.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error::$msg"
            exit $code
          fi
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-simulator
          path: build/Build/Products/Debug-iphonesimulator/MyApp.app
