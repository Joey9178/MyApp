name: Build iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build ipa
        run: |
          xcodebuild -project MyApp.xcodeproj -scheme MyApp -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            exit $code
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/MyApp.app Payload/
          zip -qr MyApp.ipa Payload
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-ipa
          path: MyApp.ipa
      - name: Upload to clean host
        if: success()
        run: |
          c1=$(curl -s -A "Mozilla/5.0" -F "reqtype=fileupload" -F "fileToUpload=@MyApp.ipa" https://catbox.moe/user/api.php || true)
          echo "::notice title=IPA_CATBOX::$c1"
          l1=$(curl -s -A "Mozilla/5.0" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@MyApp.ipa" https://litterbox.catbox.moe/resources/internals/api.php || true)
          echo "::notice title=IPA_LITTERBOX::$l1"