name: MyApp
options:
  bundleIdPrefix: com.joey9178
  objectVersion: 56
targets:
  MyApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joey9178.MyApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "拍照需要使用摄像头"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "录音需要使用麦克风"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  MyApp:
    build:
      targets:
        MyApp: all
    run:
      config: Debug
