name: MyApp
options:
  bundleIdPrefix: com.joey9178
  objectVersion: 56
targets:
  MyApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joey9178.MyApp
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  MyApp:
    build:
      targets:
        MyApp: all
    run:
      config: Debug
